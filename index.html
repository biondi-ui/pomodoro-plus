<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro+</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>🍅 Pomodoro<span>+</span></h1>
      <div class="mode-tabs">
        <button class="mode-btn active" data-mode="focus">Enfoque</button>
        <button class="mode-btn" data-mode="short">Descanso corto</button>
        <button class="mode-btn" data-mode="long">Descanso largo</button>
      </div>
    </header>

    <main>
      <section class="timer-card">
        <svg class="ring" viewBox="0 0 220 220">
          <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
          <circle class="ring-progress" cx="110" cy="110" r="100"></circle>
        </svg>
        <div class="time-display">
          <span id="time">25:00</span>
          <span class="session-label" id="sessionLabel">Enfoque</span>
        </div>
        <div class="controls">
          <button id="startPause" class="primary">Iniciar</button>
          <button id="reset">Reiniciar</button>
        </div>
      </section>

      <section class="side">
        <div class="card ambient-card">
          <h2>Sonido ambiental</h2>
          <div class="ambient-buttons">
            <button class="ambient-btn active" data-sound="none">Silencio</button>
            <button class="ambient-btn" data-sound="rain">Lluvia</button>
            <button class="ambient-btn" data-sound="waves">Olas</button>
            <button class="ambient-btn" data-sound="white">Ruido blanco</button>
          </div>
          <div class="volume-row">
            <label for="volume">Volumen</label>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.3">
          </div>
        </div>

        <div class="card stats-card">
          <h2>Estadísticas</h2>
          <div class="stats-grid">
            <div class="stat">
              <span class="stat-value" id="statSessions">0</span>
              <span class="stat-label">Sesiones hoy</span>
            </div>
            <div class="stat">
              <span class="stat-value" id="statFocusTime">0m</span>
              <span class="stat-label">Minutos enfocado</span>
            </div>
            <div class="stat">
              <span class="stat-value" id="statStreak">0</span>
              <span class="stat-label">Racha total</span>
            </div>
          </div>
          <button id="resetStats" class="link-btn">Reiniciar estadísticas</button>
        </div>
      </section>
    </main>

    <section class="card tasks-card">
      <h2>Tareas</h2>
      <form id="taskForm" class="task-form">
        <input type="text" id="taskInput" placeholder="¿En qué vas a enfocarte?" autocomplete="off">
        <button type="submit">Agregar</button>
      </form>
      <ul id="taskList" class="task-list"></ul>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
